services:
  api:
    build:
      context: ./backend
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
    ports:
      - "${WEB_PORT:-8080}:5173"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "node"
        - "-e"
        - "fetch('http://localhost:5173/').then((response) => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  verify:
    profiles: ["verify"]
    build:
      context: .
      dockerfile: verify.Dockerfile
    environment:
      VERIFY_LIVE: "1"
      API_URL: http://api:8000
      WEB_URL: http://web:5173
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    command: ["pytest", "-q"]
    restart: "no"

  e2e:
    profiles: ["e2e"]
    build:
      context: .
      dockerfile: e2e.Dockerfile
    environment:
      E2E_BASE_URL: http://web:5173
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    command: ["npx", "playwright", "test"]
    restart: "no"
